<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Checkout</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="cubos mágicos">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form action="">
            <label for="card-name">Card name: <span aria-hidden="true">*</span></label>
            <input id="card-name" name="card-name" type="text" required>
            <label for="card-number">Card number: <span aria-hidden="true">*</span></label>
            <input id="card-number" aria-describedby="card-number-help" name="card-number" type="text" required>
            <p id="card-number-help">Insert the number of your card.</p>
        </form>
    </section>
</body>
</html>
