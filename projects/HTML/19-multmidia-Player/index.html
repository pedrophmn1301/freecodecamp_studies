<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player</title>
</head>
<body>
    <h1>Multimedia Player</h1>
    <section>
        <h2>What Goes Around</h2>
        <audio controls aria-label="aqui a descricao do audio">
            <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"  type="audio/mpeg" >
        </audio>
    </section>
    <section>
        <h2>Vídeo número 2</h2>
        <video controls width="200" aria-label="aqui a descricao do video">
            <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
            <track src="legend-aqui" kind="captions" srclang="English" label="en">

            </track>
        </video>
    </section>
    <section>
        <h2>Transcrição</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. 
            Deserunt voluptatibus cumque perferendis provident magnam iure vero et voluptates eligendi non reprehenderit rem quia optio, 
            recusandae quae est, tempore eos nostrum?</p>
    </section>
</body>
</html>
