<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Receita</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Receitas</h1>
        <p>Bolo de cenoura com chocolate</p>
        <h2>Ingredientes</h2>
        <ul>
            <li>Farinha de trigo</li>
            <li>Ovos</li>
            <li>Leite condensado</li>
            <li>Chocolate</li>
        </ul>
        <h2>Instruções</h2>
        <ol>
            <li>Bata os ovos</li>
            <li>Coloque o bolo no forno</li>
            <li>Retire do forno</li>
            <li>Insira a calda de chocolate</li>
        </ol>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/recipe.jpg" alt="Ingredientes">
    </body>
