<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
</head>
<body>
    <h1>iframe Video Display</h1>
    <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/I0_951_MPE0" 
    allow="accelerometer autoplay clipboard-write 
    encrypted-media gyroscope web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen></iframe>

    <!-- #accelerometer = permite movimentos dos dispositivos 
         #autoplay = executa automaticamente
         #clipboard-write - permite gravação de dados para 
            área de transferência
         #encrypted-media = permite extensão de criptografia
         #gyroscope = exibe em piture-in-picture
         #web-share = compartilhamento de conteúdo por caixa de diálogo
         #referrerpolicy="strict-origin-when-cross-origin" = Restrições a sites inseguros
         #allowfullscreen = Permite execução em tela cheia do conteúdo
    -->

</body>
</html>
