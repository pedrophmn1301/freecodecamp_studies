<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    <form action="" id="survey-form">
        <label for="" id="name-label">Name: <input type="text" name="" id="name" required placeholder="Seu nome"></label>
        <label for="" id="email-label">E-mail: <input type="email" name="" id="email" required placeholder="Seu email"></label>
        <label for="" id="number-label">Number: <input type="number" name="" id="number" min="5" max="15" placeholder="Idade"></label>
        <label for="">Sexo: </label>
        <select name="" id="dropdown">
            <option value="masc">Maculino</option>
            <option value="fem">Feminino</option>
        </select>
        <input type="radio" name="name" value="sim">
        <label for="">Sim</label>
        <input type="radio" name="name" value="nao">
        <label for="">Não</label>
        <input type="checkbox" value="html">
        <label for="">HTML</label>
        <input type="checkbox" value="css">
        <label for="">CSS</label>
        <input type="checkbox" value="javascript">
        <label for="">JavaScript</label>
        <input type="checkbox" value="python">
        <label for="">Python</label>
        <textarea name="" id="comments"></textarea>
        <button type="submit" id="submit">Submit</button>
    </form>
</body>
</html>
