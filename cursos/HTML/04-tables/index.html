<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table>

        <thead>
            <tr>
                <th>Título da tabela</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th>Primeira linha: </th>
                <td>Dados da primeira linha</td>
            </tr>

            <tr>
                <th>Segunda linha: </th>
                <td>Dados da segunda linha</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Aqui está o rodapé da tabela. 
                    O rodapé desta tabela pode conter a data de publicação, 
                    os créditos dos autores ou outras metainformações.</th>
            </tr>
        </tfoot>

    </table>
</body>
</html>
